syntax = "proto3";

package api.proto.domain;

option go_package = "github.com/gsoultan/pontus/api/proto/domain";

import "google/protobuf/timestamp.proto";
import "api/proto/domain/project.proto";
import "api/proto/domain/metrics.proto";

message BackendStatus {
  string address = 1;
  string zone = 15;
  bool healthy = 2;
  int64 active_conns = 3;
  google.protobuf.Timestamp last_check = 4;
  string role = 5;
  int64 latency_ms = 6;
  int64 replication_lag_ms = 7;
  bool is_draining = 8;
  int32 weight = 9;
  int32 max_conns = 10;
  int32 current_max_conns = 16;
  int32 idle_conns = 11;
  int64 wait_queue_size = 12;
  int64 total_requests = 13;
  int64 total_errors = 14;
  int64 rtt_ms = 17;
  bool managed_by_agent = 18;
  string agent_address = 19;
  AgentDatabaseConfig agent_config = 20;
  DatabaseMetrics db_metrics = 21;
  string installed_version = 22;
  string recommended_version = 23;
  // Replication streams held on this node. Counted separately from
  // active_conns because a stream occupies a pool permit for hours and never
  // returns to the idle set — reporting both as "connections" hides the fact
  // that this part of the capacity is not coming back.
  int32 stream_conns = 24;
  int32 max_stream_conns = 25;

  // Whether a replica currently has a WAL receiver attached to a primary.
  //
  // Reported separately from healthy because it is the state that looks
  // healthiest and is worst: the node is up and answering, and every row it
  // returns is older than the last. Always true for a primary, which has no
  // upstream to stream from.
  bool streaming = 26;

  // Whether this backend is currently allowed to serve reads, after the lag
  // threshold and the reattach dwell.
  //
  // Distinct from streaming: a replica that has just reconnected is streaming
  // but not yet eligible while it serves out the dwell. Without both, that
  // looks like a routing fault rather than a deliberate wait.
  bool read_eligible = 27;
}

// ReplicationSlot is one row of pg_replication_slots.
//
// Reported separately from ReplicationStream on purpose: PostgreSQL sees the
// proxy's address in pg_stat_replication, not the consumer's, so a proxied
// stream cannot be correlated to a slot without parsing the replication
// command exchange. Slots are authoritative about retained WAL; streams are
// authoritative about who is connected.
message ReplicationSlot {
  string name = 1;
  string plugin = 2;
  // "logical" or "physical".
  string slot_type = 3;
  bool active = 4;
  string database = 5;
  string confirmed_lsn = 6;
  // WAL held by this slot. An inactive slot that keeps growing is what fills
  // the disk, so this is the number worth alerting on.
  int64 retained_bytes = 7;
}

// ReplicationStream is one CDC or physical replication consumer.
//
// A stream is pinned to the node holding its slot: it is not balanced and it
// cannot move during failover. The UI deliberately calls these "streams" and
// never "connections" so the difference is visible without explanation.
message ReplicationStream {
  string id = 1;
  // slot_name is empty for a consumer that has not yet attached to a slot.
  string slot_name = 2;
  string client_addr = 3;
  string backend_addr = 4;
  string database = 5;
  string user = 6;
  // "logical" or "physical".
  string kind = 7;
  // Output plugin for logical streams: pgoutput, wal2json, …
  string plugin = 8;
  google.protobuf.Timestamp started_at = 9;
  // How far behind the stream is, in bytes of WAL and in wall-clock time.
  int64 lag_bytes = 10;
  int64 lag_ms = 11;
  // Last LSN confirmed by the consumer, as text (e.g. "0/1A2B3C4").
  string confirmed_lsn = 12;
  bool active = 13;
}

message AdaptiveStatus {
  bool is_throttled = 1;
  string throttle_reason = 2;
  int32 current_max_waiters = 3;
  int32 active_goroutines = 4;
}

message PerformanceSuggestion {
  string title = 1;
  string description = 2;
  string level = 3; // "info", "warning", "critical"
  string action = 4;
}

message Topology {
  repeated TopologyNode nodes = 1;
  repeated TopologyEdge edges = 2;
}

message TopologyNode {
  string id = 1;
  string label = 2;
  string type = 3; // "proxy", "primary", "replica"
  string status = 4; // "healthy", "unhealthy", "draining"
  string address = 5;
}

message TopologyEdge {
  string from = 1;
  string to = 2;
  string label = 3;
  string type = 4;
}

message MetricSnapshot {
  google.protobuf.Timestamp timestamp = 1;
  float requests_per_second = 2;
  float error_rate = 3;
  float latency_ms = 4;
}

message CacheStats {
  int64 hits = 1;
  int64 misses = 2;
  int64 items_count = 3;
  float hit_ratio = 4;
}
