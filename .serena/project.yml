# Serena project configuration for Pontus.
# See https://oraios.github.io/serena/02-usage/050_configuration.html

project_name: "pontus"

# Go is the primary language; typescript covers the embedded web dashboard.
languages:
  - go
  - typescript

encoding: "utf-8"
line_ending:
language_backend:

# Respect .gitignore so web/dist, web/node_modules and the local *.db files stay out.
ignore_all_files_in_gitignore: true

ignored_paths:
  - "web/src/gen/**"
  - "api/proto/**/*.pb.go"
  - "api/proto/**/*connect*.go"
  - "graphify-out/**"

read_only: false

excluded_tools: []
included_optional_tools: []
fixed_tools: []

default_modes:
added_modes:

initial_prompt: ""

symbol_info_budget:

read_only_memory_patterns: []
ignored_memory_patterns: []
