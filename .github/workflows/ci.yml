name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # go.sum is intentionally not tracked, so the module graph has to be
      # resolved before any Go command runs. Plain `go mod download` is NOT
      # enough: it writes a partial go.sum and the build still fails with
      # "missing go.sum entry". `all` resolves the full package graph.
      - name: Install dependencies
        run: |
          go mod download all
          bun install --cwd web

      - name: Generate Protobuf
        run: buf generate

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: buf generate produced changes that were not committed"
            git status
            exit 1
          fi

      # The dashboard bundle is an INPUT to the Go build, not an output of it:
      # web/ui.go does //go:embed all:dist and web/dist is gitignored. Every Go
      # step below needs it to exist, so the web build comes first.
      - name: Web Lint
        run: bun run --cwd web lint

      - name: Web Typecheck
        run: bun run --cwd web typecheck

      - name: Web Build
        run: bun run --cwd web build

      - name: Go Lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: latest
          # Gate new work, not the backlog. .golangci.yml encodes the limits in
          # .junie/guidelines.md and the tree has a few hundred pre-existing
          # findings against them; failing the build on those would mean
          # everyone disables the linter, and a rule everyone suppresses is
          # worse than no rule. New and changed lines have to be clean.
          only-new-issues: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -race -v ./...

      - name: Go Build Check
        run: |
          go build -v -o /dev/null ./cmd/pontus
          go build -v -o /dev/null ./cmd/agent
          go build -v -o /dev/null ./cmd/pontusctl

      # End-to-end suite against a real PostgreSQL. Skips itself when no
      # backend is reachable, so it never blocks on infrastructure being down.
      - name: Start PostgreSQL
        run: |
          # wal_level=logical lets the replication-slot tests run rather than
          # skip; everything else works at the default.
          docker run -d --name pontus-e2e-pg -p 5433:5432 \
            -e POSTGRES_PASSWORD=postgres postgres:17-alpine \
            -c wal_level=logical
          for i in $(seq 1 30); do
            docker exec pontus-e2e-pg pg_isready -U postgres && break
            sleep 2
          done

      - name: Go E2E
        run: go test -tags e2e -timeout 20m ./e2e/...

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f pontus-e2e-pg || true

      - name: GoReleaser Check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
