name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install dependencies
        run: |
          go mod download
          bun install --cwd web

      - name: Generate Protobuf
        run: buf generate

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: buf generate produced changes that were not committed"
            git status
            exit 1
          fi

      - name: Go Lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: latest

      - name: Go Test
        run: go test -v ./...

      - name: Web Lint
        run: bun run --cwd web lint

      - name: Web Build
        run: bun run --cwd web build

      - name: Go Build Check
        run: |
          go build -v -o /dev/null ./cmd/pontus
          go build -v -o /dev/null ./cmd/agent

      - name: GoReleaser Check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
