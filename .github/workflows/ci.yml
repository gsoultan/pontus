name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # go.sum is intentionally not tracked, so the module graph has to be
      # resolved before any Go command runs. Plain `go mod download` is NOT
      # enough: it writes a partial go.sum and the build still fails with
      # "missing go.sum entry". `all` resolves the full package graph.
      - name: Install dependencies
        run: |
          go mod download all
          bun install --cwd web

      # buf.gen.yaml uses local plugins, so each one has to be on $PATH.
      # Setting up buf installs the buf CLI and nothing else, which is why
      # `buf generate` could not run here — and why the release job, whose
      # goreleaser before-hook runs it, could not either.
      #
      # Pinned to the versions that produced the committed output, because the
      # next step fails if generation yields a diff. Verified locally: these
      # exact versions regenerate api/ and web/src/gen/ byte for byte.
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # protoc-gen-es comes from web/package.json rather than a go install.
          echo "$PWD/web/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Generate Protobuf
        run: buf generate

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: buf generate produced changes that were not committed"
            git status
            exit 1
          fi

      # The dashboard bundle is an INPUT to the Go build, not an output of it:
      # web/ui.go does //go:embed all:dist and web/dist is gitignored. Every Go
      # step below needs it to exist, so the web build comes first.
      - name: Web Lint
        run: bun run --cwd web lint

      - name: Web Typecheck
        run: bun run --cwd web typecheck

      - name: Web Build
        run: bun run --cwd web build

      # golangci/…, not golangci-lint/… — the latter does not exist, and an
      # action that cannot be resolved fails the job at "Set up job", before a
      # single step runs. So nothing in this file executed: no build, no vet,
      # no tests, no end-to-end suite. CI reported failure on every commit and
      # the failure was always this, which is easy to stop reading after a
      # while.
      #
      # v9 because .golangci.yml is v2 configuration; the v6 action installs
      # golangci-lint v1, which cannot read it. Pinned rather than "latest" so
      # a lint release cannot turn a green build red on its own.
      - name: Go Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          # Gate new work, not the backlog. .golangci.yml encodes the limits in
          # .junie/guidelines.md and the tree has a few hundred pre-existing
          # findings against them; failing the build on those would mean
          # everyone disables the linter, and a rule everyone suppresses is
          # worse than no rule. New and changed lines have to be clean.
          only-new-issues: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -race -v ./...

      - name: Go Build Check
        run: |
          go build -v -o /dev/null ./cmd/pontus
          go build -v -o /dev/null ./cmd/agent
          go build -v -o /dev/null ./cmd/pontusctl

      # End-to-end suite against a real primary *and* a streaming replica.
      #
      # A single node was not enough and the shortfall was silent: fourteen call
      # sites across four files ask for a two-node cluster and skip without one,
      # so read/write splitting, replica routing, session survival across
      # backends and primary-loss behaviour never ran here — the exact surface
      # where the worst defects have been found — while CI stayed green.
      #
      # The same script the tests are developed against, so CI and a laptop
      # build the same topology.
      - name: Start PostgreSQL cluster
        run: ./scripts/e2e-cluster.sh up

      # ubuntu-latest ships the PostgreSQL server package but keeps its binaries
      # out of PATH, and e2e/local_cluster_test.go skips without initdb, pg_ctl,
      # pg_basebackup and postgres. That skip is how automatic failover — the
      # highest-consequence path in the tree — went unverified on every commit
      # while CI stayed green. TestLocalAutomaticFallback needs real clusters
      # rather than the container pair: it stops a database, and in a container
      # PostgreSQL is PID 1, so stopping it takes the co-located agent down too.
      - name: PostgreSQL server binaries on PATH
        run: |
          bindir=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$bindir" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            bindir=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          fi
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/initdb" --version

      # A second, disposable pair for the promotion and rejoin tests. Promotion
      # is one way — a promoted replica is on a new timeline and cannot follow
      # its old primary again — so those tests refuse to run against the shared
      # cluster the rest of the suite depends on, and skip when this is absent.
      - name: Start disposable cluster for promotion
        run: |
          AGENT="$RUNNER_TEMP/pontus-agent"
          CGO_ENABLED=0 go build -o "$AGENT" ./cmd/agent
          AGENT_BINARY="$AGENT" AGENT_TOKEN=e2e-agent-token \
            PRIMARY_NAME=pontus-promo-primary REPLICA_NAME=pontus-promo-replica \
            PRIMARY_PORT=55842 REPLICA_PORT=55843 \
            PRIMARY_AGENT_PORT=19191 REPLICA_AGENT_PORT=19193 \
            ./scripts/e2e-cluster.sh up

      - name: Go E2E
        env:
          PONTUS_E2E_BACKEND: 127.0.0.1:55832
          PONTUS_E2E_REPLICA: 127.0.0.1:55833
          # Stops the primary container and restores it in t.Cleanup. Without
          # this, primary-loss behaviour never ran here.
          PONTUS_E2E_DISRUPTIVE: "1"
          PONTUS_E2E_PROMO_PRIMARY: 127.0.0.1:55842
          PONTUS_E2E_PROMO_REPLICA: 127.0.0.1:55843
          PONTUS_E2E_PROMO_TOKEN: e2e-agent-token
          PONTUS_E2E_PROMO_PRIMARY_CONTAINER: pontus-promo-primary
        # 40m rather than 20m: the local-cluster tests run initdb and
        # pg_basebackup for real, and a CI runner is slower than the laptop the
        # per-step deadlines inside them were written against.
        run: go test -tags e2e -timeout 40m ./e2e/...

      - name: Stop disposable cluster
        if: always()
        run: |
          PRIMARY_NAME=pontus-promo-primary REPLICA_NAME=pontus-promo-replica \
            ./scripts/e2e-cluster.sh down || true

      - name: Stop PostgreSQL cluster
        if: always()
        run: ./scripts/e2e-cluster.sh down || true

      - name: GoReleaser Check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
