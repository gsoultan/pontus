# .goreleaser.yaml
version: 2

before:
  hooks:
    - go mod tidy
    - buf generate
    # `bun install --cwd web`, not `bun --cwd web install`: the latter is
    # parsed as "run a script named install", which bun reports as
    # `Script not found "install"`. The release had never been run, so neither
    # this nor the missing protoc plugins above it had ever been noticed.
    - bun install --cwd web
    - bun run --cwd web build

builds:
  - id: pontus
    main: ./cmd/pontus
    binary: pontus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/gsoultan/pontus/pkg/version.Version={{.Version}} -X github.com/gsoultan/pontus/pkg/version.Commit={{.Commit}} -X github.com/gsoultan/pontus/pkg/version.BuildTime={{.Date}}

  - id: agent
    main: ./cmd/agent
    binary: pontus-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/gsoultan/pontus/pkg/version.Version={{.Version}} -X github.com/gsoultan/pontus/pkg/version.Commit={{.Commit}} -X github.com/gsoultan/pontus/pkg/version.BuildTime={{.Date}}

archives:
  # `formats` (a list), not `format`. GoReleaser v2 deprecated the singular
  # form, and `goreleaser check` — which CI runs — fails on a deprecated
  # property, so the release job was red on the config rather than the code.
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with what make it easier to download
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  # Detect a pre-release from the tag rather than declaring every build final.
  # Without this GoReleaser publishes v0.1.0-rc.1 as a full release and GitHub
  # marks it "Latest", so anyone landing on the repository is handed a release
  # candidate as the thing to install.
  prerelease: auto

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
